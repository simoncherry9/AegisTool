# AegisWiFi — configuración de ejemplo (minuta §12 y §34).
# Copia este archivo a config.yaml o usa variables de entorno (AEGISWIFI_*).
# Los valores de entorno tienen prioridad sobre este archivo.

app:
  environment: development      # development | production
  debug: false
  log_level: INFO               # DEBUG | INFO | WARNING | ERROR
  log_json: false               # logs en JSON (recomendado en producción)
  api_host: 127.0.0.1           # NUNCA exponer fuera de localhost por defecto (minuta §34)
  api_port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

database:
  # Vacío => SQLite en paths.data_dir/aegiswifi.db
  url: ""
  # PostgreSQL (futura fase): "postgresql+psycopg://aegiswifi:secret@localhost/aegiswifi"

paths:
  data_dir: ./data
  evidence_dir: ./data/evidence

security:
  # Clave Fernet en base64 para cifrar secretos en reposo (minuta §19).
  # Generar con:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  encryption_key_b64: ""
  require_auth: true

# ---------------------------------------------------------------------------
# Ejemplo de alcance/autorización de un engagement (minuta §12).
# Este bloque NO se carga en la app directamente; es un plantilla que se
# importa por engagement con `aegiswifi scope import <archivo.yaml>`.
# ---------------------------------------------------------------------------
scope_example:
  engagement:
    id: ENG-2026-001
    client: Laboratorio autorizado
    operator: Operador principal
    valid_from: 2026-07-29T08:00:00-03:00
    valid_until: 2026-07-29T18:00:00-03:00

  scope:
    allowed_ssids:
      - LAB-WPA2
      - LAB-WPA3
    allowed_bssids:
      - AA:BB:CC:DD:EE:FF
    channels: []
    bands: []

  permissions:
    passive_capture: true
    handshake_capture: true
    pmkid_capture: true
    controlled_reconnect: true
    password_audit: true
    wps_testing: true
    enterprise_testing: false
    denial_of_service: false
    protocol_fuzzing: false

  limits:
    maximum_active_frames: 4
    maximum_cracking_duration_minutes: 120
    maximum_gpu_temperature: 78
