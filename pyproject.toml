[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiswifi"
version = "0.1.0"
description = "AegisWiFi — Plataforma profesional de auditoría de redes inalámbricas"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "AegisWiFi Contributors" }]
keywords = ["wifi", "wireless", "security", "audit", "kali", "aircrack", "hashcat"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "typer>=0.13",
  "structlog>=24.4",
  "cryptography>=43",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "psutil>=6.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
aegiswifi = "aegiswifi.cli:app"

# --- Packaging: backend/aegiswifi -> importable package `aegiswifi` ---
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["aegiswifi*"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "PLC0415"]
"backend/aegiswifi/database/models.py" = ["E501"]
# FastAPI `Depends` / Typer `Argument` en defaults de parámetros es idiomático.
"backend/aegiswifi/api/**/*.py" = ["B008"]
"backend/aegiswifi/cli.py" = ["B008", "PLC0415"]
# Caché singleton de engine vía `global` (patrón intencional).
"backend/aegiswifi/database/engine.py" = ["PLW0603"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = ["-q", "-ra"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["backend/aegiswifi"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
